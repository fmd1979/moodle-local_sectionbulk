name: Bug report
description: Report a reproducible problem in Bulk Sections & Quizzes Manager.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: moodle
    attributes: {label: Moodle version, placeholder: "e.g. 5.1.3"}
    validations: {required: true}
  - type: input
    id: php
    attributes: {label: PHP version, placeholder: "e.g. 8.3"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual result}
    validations: {required: true}
